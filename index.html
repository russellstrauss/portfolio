<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- Preconnect to Google Fonts for faster loading -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<!-- Preload critical fonts -->
		<link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Merriweather:wght@400&family=Quicksand:wght@300&display=swap" as="style">
		<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Merriweather:wght@400&family=Quicksand:wght@300&display=swap" rel="stylesheet">
		<link rel="icon" href="/favicon.ico">
		<title>Farmer John Technologies</title>
		<link href="/vendors/prism.css" rel="stylesheet" />
		<style>
			/* Prevent flash of unstyled text by setting fallback fonts immediately */
			html, body {
				font-family: 'Merriweather', Georgia, serif;
			}
			h1, h2, h3, h4, h5, h6, .name, nav.main, nav.main ul li {
				font-family: 'IBM Plex Mono', 'Courier New', monospace;
			}
			/* Ensure fonts are visible while loading */
			* {
				font-display: swap;
			}
		</style>
	</head>

	<body>
		<div id="app"></div>
		
		<script type="module" src="/src/main.js"></script>
		
		<script type="text/javascript" src="https://cs.nyu.edu/~kapp/cs101/processing_on_the_web/processing.js"></script>
		<script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
		<script src="/vendors/prism.js"></script> <!-- Code Highlighting -->
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-markdown.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-powershell.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
		<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
		
		<script src="/vendors/d3.v5.min.js"></script>
		<script src="https://d3js.org/d3-color.v2.min.js"></script>
		<script src="https://d3js.org/d3-interpolate.v2.min.js"></script>
		<script src="https://d3js.org/d3-scale-chromatic.v2.min.js"></script>
		
		<!-- <script src="/vendors/three.min.js"></script>
		<script src="/vendors/OrbitControls.js"></script> -->
	</body>

</html>
